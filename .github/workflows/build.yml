name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: gradle assembleDebug --stacktrace
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: subtitulos-es-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Última versión" \
            --notes "APK de prueba generado automáticamente. Descarga app-debug.apk e instálalo." \
            --target "${{ github.sha }}"
